<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#824653">
  <title>Login - Portal Presensi Piket | SMK MedikaCom</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style-login-balanced.css">
  <style>
    /* Tema SISENSI: Burgundy + Pale Beige */
    body.login-body {
      --burgundy: #824653;
      --burgundy-dark: #6F3945;
      --burgundy-soft: #A66F7A;
      --burgundy-pale: #F2E5E7;
      --beige: #F5F0E7;
      --ink: #34272B;
      --muted: #897B7E;
      --line: #E5D9D5;
      margin: 0;
      min-height: 100vh;
      padding: 28px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 100% 0%, rgba(166,111,122,.16) 0 120px, transparent 121px),
        radial-gradient(circle at 0% 100%, rgba(130,70,83,.10) 0 150px, transparent 151px),
        linear-gradient(135deg, #F5F0E7 0%, #FBF8F2 55%, #F1EAE0 100%);
    }
    body.login-body * { box-sizing: border-box; }
    body.login-body > .container-login {
      width: min(790px, calc(100vw - 40px)) !important;
      max-width: 790px !important;
      min-width: 0;
      min-height: 425px;
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(0, 1fr);
      overflow: hidden;
      padding: 0;
      margin: auto;
      border: 1px solid rgba(255,255,255,.96);
      border-radius: 26px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 24px 70px rgba(83,45,54,.13);
    }
    .login-visual {
      position: relative;
      min-height: 425px;
      overflow: hidden;
      background: #E8D7D9;
      display: flex;
      align-items: flex-end;
      padding: 22px;
      isolation: isolate;
    }
    .login-visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("./assets/login-illustration.png") center center / cover no-repeat;
      z-index: -2;
    }
    .login-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(111,57,69,0) 36%, rgba(75,37,46,.82) 100%);
      z-index: -1;
    }
    .visual-copy { color: #fff; text-shadow: 0 2px 12px rgba(40,15,20,.22); }
    .visual-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 7px 12px;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 999px;
      background: rgba(130,70,83,.36);
      backdrop-filter: blur(8px);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .visual-copy h3 { margin: 0 0 8px; font-size: clamp(24px, 2.5vw, 32px); line-height: 1.25; font-weight: 700; }
    .visual-copy p { max-width: 330px; margin: 0; font-size: 13px; line-height: 1.8; color: rgba(255,255,255,.94); }
    .login-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(22px, 3.2vw, 46px);
      min-width: 0;
    }
    .login-brand { display: flex; justify-content: center; margin-bottom: 22px; }
    .container-login .logo { display: block; width: min(180px, 100%); height: auto; max-height: 62px; object-fit: contain; margin: 0 auto; }
    .login-heading { text-align: center; margin-bottom: 20px; }
    .login-heading h2 { margin: 0 0 8px; color: #292524; font-size: clamp(25px, 2.3vw, 32px); line-height: 1.3; font-weight: 700; letter-spacing: -.035em; }
    .login-heading p { margin: 0; color: #897B7E; font-size: 13px; line-height: 1.7; }
    .login-form { display: grid; gap: 13px; }
    .login-field label { display: block; margin: 0 0 8px; color: #292524; font-size: 13px; font-weight: 600; }
    .login-input-wrap { position: relative; }
    .login-input-wrap .field-icon {
      position: absolute; left: 17px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; color: #A18489; pointer-events: none;
    }
    .container-login .login-input {
      width: 100%; height: 42px; margin: 0; padding: 0 44px 0 46px;
      border: 1.5px solid #E5D9D5; border-radius: 15px; outline: none;
      background: #FFFEFC; color: #34272B; font: 400 14px 'Poppins', sans-serif;
      text-align: left; transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .container-login .login-input::placeholder { color: #A99A9D; opacity: 1; }
    .container-login .login-input:focus { border-color: #A66F7A; box-shadow: 0 0 0 4px rgba(166,111,122,.15); background: #fff; }
    .password-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 34px; height: 34px; display: grid; place-items: center;
      border: 0; border-radius: 9px; color: #A66F7A; background: transparent; cursor: pointer;
    }
    .password-toggle:hover { background: #F2E5E7; color: #6F3945; }
    .password-toggle svg { width: 20px; height: 20px; }
    .container-login .login-btn {
      width: auto; min-width: 132px; max-width: 190px; align-self: center; padding: 0 24px; min-width: 120px; align-self: center; padding: 0 22px;
      min-height: 42px; margin: 4px 0 0; border: 0; border-radius: 15px;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(100deg, #A66F7A, #95606B); color: white;
      font: 600 14px 'Poppins', sans-serif; cursor: pointer;
      box-shadow: 0 8px 18px rgba(130,70,83,.18); transition: transform .18s, box-shadow .18s, filter .18s;
    }
    .container-login .login-btn:hover { transform: translateY(-1px); background: linear-gradient(100deg, #95606B, #824653); box-shadow: 0 12px 22px rgba(130,70,83,.23); filter: brightness(1.02); }
    .container-login .login-btn:active { transform: translateY(0); }
    .login-btn svg { width: 20px; height: 20px; }
    .login-footer { display: flex; align-items: center; justify-content: center; gap: 13px; margin-top: 20px; color: #9A8B8D; font-size: 11px; text-align: center; }
    .login-footer::before, .login-footer::after { content: ""; height: 1px; width: 34px; background: #E5D9D5; }
    .container-login .error-msg { min-height: 0; margin-top: 12px; color: #B42332; font-size: 12px; text-align: center; }
    #loadingOverlay { z-index: 9999; }
    #loadingOverlay .spinner { border-top-color: #824653 !important; }
    @media (min-width: 821px) {
      body.login-body > .container-login {
        width: min(790px, calc(100vw - 40px)) !important;
        max-width: 790px !important;
        grid-template-columns: minmax(0, .92fr) minmax(0, 1fr) !important;
      }
      body.login-body > .container-login > .login-visual,
      body.login-body > .container-login > .login-content { min-width: 0; }
    }
    @media (max-width: 820px) {
      body.login-body { padding: 18px; }
      body.login-body > .container-login { width: min(560px, calc(100vw - 36px)) !important; max-width: 560px !important; min-height: auto; grid-template-columns: 1fr !important; border-radius: 23px; }
      .login-visual { min-height: 210px; padding: 24px; }
      .login-visual::before { background-position: center 54%; }
      .login-visual::after { background: linear-gradient(90deg, rgba(75,37,46,.66), rgba(111,57,69,.10)); }
      .visual-copy h3 { font-size: 23px; }
      .visual-copy p { max-width: 290px; font-size: 12px; }
      .login-content { padding: 32px clamp(22px, 7vw, 48px) 28px; }
      .login-title-row { gap: 14px; margin-bottom: 25px; }
      .container-login .logo { width: 58px; height: 54px; max-width: 58px; max-height: 54px; }
      .login-title-divider { height: 42px; }
      .login-heading h2 { font-size: clamp(20px, 4.5vw, 26px); }
    }
    @media (max-width: 420px) {
      body.login-body { padding: 12px; align-items: flex-start; }
      body.login-body > .container-login { width: min(560px, calc(100vw - 24px)) !important; max-width: 560px !important; border-radius: 19px; margin: auto 0; }
      .login-visual { min-height: 165px; padding: 18px; }
      .visual-copy h3 { font-size: 20px; }
      .visual-copy p { font-size: 11px; line-height: 1.6; }
      .login-content { padding: 26px 20px 23px; }
      .login-title-row { gap: 10px; }
      .container-login .logo { width: 48px; height: 46px; max-width: 48px; max-height: 46px; }
      .login-title-divider { height: 38px; }
      .login-heading h2 { font-size: clamp(18px, 5vw, 22px); }
      .container-login .login-input { height: 54px; min-height: 54px; border-radius: 13px; }
      .container-login .login-btn { height: 46px; min-height: 46px; min-width: 120px; padding: 0 22px; border-radius: 13px; }
      .login-form { gap: 13px; }
      .login-footer { margin-top: 25px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .container-login *, .container-login *::before, .container-login *::after { transition: none !important; }
    }

    /* Tombol tampilkan password: posisi stabil dan selalu terlihat */
    .password-field, .password-wrapper, .password-input-wrap, .input-password-wrap {
      position: relative; width: 100%;
    }
    .password-toggle, .toggle-password, #togglePassword, #togglePasswordBtn, .show-password, .password-eye {
      position: absolute !important; right: 10px !important; top: 50% !important;
      transform: translateY(-50%) !important; display: inline-flex !important;
      align-items: center !important; justify-content: center !important;
      width: 30px !important; height: 30px !important; padding: 0 !important;
      margin: 0 !important; border: 0 !important; border-radius: 7px !important;
      background: transparent !important; color: #A66F7A !important;
      opacity: 1 !important; visibility: visible !important; z-index: 5 !important;
      cursor: pointer !important;
    }
    .password-field input, .password-wrapper input, .password-input-wrap input, .input-password-wrap input, #kodeAkses {
      padding-right: 54px !important;
    }
    .password-toggle svg, .toggle-password svg, #togglePassword svg, #togglePasswordBtn svg, .show-password svg, .password-eye svg {
      width: 20px !important; height: 20px !important; opacity: 1 !important; visibility: visible !important;
    }
    @media (max-width: 700px) {
      .login-card, .login-shell, .login-container, .container-login {
        width: calc(100vw - 28px) !important; max-width: 460px !important; min-height: auto !important;
      }
    }
    .password-toggle:hover, .toggle-password:hover, #togglePassword:hover, #togglePasswordBtn:hover, .show-password:hover, .password-eye:hover {
      background: #F2E5E7 !important; color: #6F3945 !important;
    }
    .password-toggle:focus-visible, .toggle-password:focus-visible, #togglePassword:focus-visible, #togglePasswordBtn:focus-visible, .show-password:focus-visible, .password-eye:focus-visible {
      outline: 2px solid #A66F7A !important; outline-offset: 2px !important; border-radius: 5px !important;
    }
  </style>
</head>
<body class="login-body">
  <main class="container-login">
    <section class="login-visual" aria-label="Informasi sekolah">
      <div class="visual-copy">
        <div class="visual-eyebrow">
          <span aria-hidden="true">✦</span> SISENSI - SISTEM PRESENSI
        </div>
        <!-- <h3>Presensi Piket<br>Lebih Mudah.</h3> -->
        <p>Jikalau bisa tidak sulit kenapa harus tidak mudah.</p>
      </div>
    </section>

    <section class="login-content" aria-labelledby="loginTitle">
      <header class="login-title-row" aria-labelledby="loginTitle">
        <img src="./assets/logo_sekolah.png" class="logo" alt="Logo sekolah">
        <span class="login-title-divider" aria-hidden="true"></span>
        <div class="login-heading">
          <h2 id="loginTitle">Portal Presensi Piket</h2>
        </div>
      </header>

      <form class="login-form" id="loginForm" onsubmit="event.preventDefault(); login();">
        <div class="login-field">
          <label for="idPiket">Username</label>
          <div class="login-input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-2a8 8 0 0 1 16 0v2"></path></svg>
            <input type="text" id="idPiket" class="login-input" placeholder="Masukkan username" autocomplete="username" required>
          </div>
        </div>
        <div class="login-field">
          <label for="kodeAkses">Password</label>
          <div class="login-input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><path d="M12 14v3"></path></svg>
            <input type="password" id="kodeAkses" class="login-input" placeholder="Masukkan password" autocomplete="current-password" required>
            <button class="password-toggle" type="button" id="togglePassword" aria-label="Tampilkan password" title="Tampilkan password" aria-pressed="false">
              <svg id="passwordEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="login-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"></path></svg>
          Masuk
        </button>
      </form>
      <div class="error-msg" id="errorMsg" role="alert" aria-live="polite"></div>
      <footer class="login-footer">© SISENSI v 5.1</footer>
    </section>
  </main>

  <div id="loadingOverlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="loadingText">Memproses...</p>
    </div>
  </div>

  <script>
    const password = document.getElementById('kodeAkses');
    const toggle = document.getElementById('togglePassword');
    const icon = document.getElementById('passwordEyeIcon');

    const eye = `
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    `;
    const eyeOff = `
      <path d="M3 3l18 18"></path>
      <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
      <path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-4 4.8"></path>
      <path d="M6.6 6.6C3.6 8.5 2 12 2 12s3.5 7 10 7c1 0 2-.2 2.9-.5"></path>
    `;
    toggle.addEventListener('click', function () {
      const show = password.type === 'password';
      password.type = show ? 'text' : 'password';
      icon.innerHTML = show ? eyeOff : eye;
      toggle.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
      toggle.setAttribute('title', show ? 'Sembunyikan password' : 'Tampilkan password');
      toggle.setAttribute('aria-pressed', String(show));
    });
  </script>

  <script src="./js/auth.js"></script>
</body>
</html>
