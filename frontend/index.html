<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e8f6f4">
  <title>Login - Portal Presensi Piket | SMK MedikaCom</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    /* Login page refresh — styling is scoped to this page */
    body.login-body {
      --medika-teal: #007b83;
      --medika-deep: #123f49;
      --medika-muted: #789099;
      --medika-line: #d7e4e6;
      --medika-mint: #eaf7f5;
      margin: 0;
      min-height: 100vh;
      padding: 28px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: var(--medika-deep);
      background:
        radial-gradient(circle at 100% 0%, rgba(147, 224, 218, .55) 0 120px, transparent 121px),
        radial-gradient(circle at 0% 100%, rgba(147, 224, 218, .42) 0 150px, transparent 151px),
        linear-gradient(135deg, #e8f6f4 0%, #f8fbfa 55%, #e3f5f2 100%);
    }
    body.login-body * { box-sizing: border-box; }
    .container-login {
      width: min(1160px, 100%);
      min-height: 620px;
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(0, 1fr);
      overflow: hidden;
      padding: 0;
      margin: auto;
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 26px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 24px 70px rgba(28, 94, 97, .13);
    }
    .login-visual {
      position: relative;
      min-height: 620px;
      overflow: hidden;
      background: #d9f3ef;
      display: flex;
      align-items: flex-end;
      padding: 34px;
      isolation: isolate;
    }
    .login-visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("./medikacom-login-illustration.png") center center / cover no-repeat;
      z-index: -2;
    }
    .login-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(14,128,130,0) 40%, rgba(8,83,89,.72) 100%);
      z-index: -1;
    }
    .visual-copy { color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.16); }
    .visual-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 7px 12px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      background: rgba(255,255,255,.17);
      backdrop-filter: blur(8px);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .visual-copy h3 { margin: 0 0 8px; font-size: clamp(24px, 2.5vw, 32px); line-height: 1.25; font-weight: 700; }
    .visual-copy p { max-width: 330px; margin: 0; font-size: 13px; line-height: 1.8; color: rgba(255,255,255,.92); }
    .login-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(34px, 5vw, 72px);
      min-width: 0;
    }
    .login-brand { display: flex; justify-content: center; margin-bottom: 28px; }
    .container-login .logo { display: block; width: min(260px, 100%); height: auto; max-height: 90px; object-fit: contain; margin: 0 auto; }
    .login-heading { text-align: center; margin-bottom: 34px; }
    .login-heading h2 { margin: 0 0 8px; color: #123f49; font-size: clamp(25px, 2.3vw, 32px); line-height: 1.3; font-weight: 700; letter-spacing: -.035em; }
    .login-heading p { margin: 0; color: #80949b; font-size: 13px; line-height: 1.7; }
    .login-form { display: grid; gap: 20px; }
    .login-field label { display: block; margin: 0 0 8px; color: #234d56; font-size: 13px; font-weight: 600; }
    .login-input-wrap { position: relative; }
    .login-input-wrap .field-icon {
      position: absolute; left: 17px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; color: #7d969d; pointer-events: none;
    }
    .container-login .login-input {
      width: 100%; height: 58px; margin: 0; padding: 0 48px 0 54px;
      border: 1.5px solid #d7e3e5; border-radius: 15px; outline: none;
      background: #fff; color: #163f48; font: 400 14px 'Poppins', sans-serif;
      text-align: left; transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .container-login .login-input::placeholder { color: #9aabb0; opacity: 1; }
    .container-login .login-input:focus { border-color: #07858b; box-shadow: 0 0 0 4px rgba(0,123,131,.10); background: #fcffff; }
    .password-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 34px; height: 34px; display: grid; place-items: center;
      border: 0; border-radius: 9px; color: #7d969d; background: transparent; cursor: pointer;
    }
    .password-toggle:hover { background: #edf8f6; color: #007b83; }
    .password-toggle svg { width: 20px; height: 20px; }
    .container-login .login-btn {
      width: 100%; min-height: 58px; margin: 4px 0 0; border: 0; border-radius: 15px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(100deg, #00747c, #00838a); color: white;
      font: 600 16px 'Poppins', sans-serif; cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,123,131,.16); transition: transform .18s, box-shadow .18s, filter .18s;
    }
    .container-login .login-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 22px rgba(0,123,131,.22); filter: brightness(1.03); }
    .container-login .login-btn:active { transform: translateY(0); }
    .login-btn svg { width: 20px; height: 20px; }
    .login-footer { display: flex; align-items: center; justify-content: center; gap: 13px; margin-top: 32px; color: #879ba1; font-size: 11px; text-align: center; }
    .login-footer::before, .login-footer::after { content: ""; height: 1px; width: 34px; background: #d8e5e6; }
    .container-login .error-msg { min-height: 0; margin-top: 12px; color: #c0392b; font-size: 12px; text-align: center; }
    #loadingOverlay { z-index: 9999; }
    @media (max-width: 820px) {
      body.login-body { padding: 18px; }
      .container-login { max-width: 560px; min-height: auto; grid-template-columns: 1fr; border-radius: 23px; }
      .login-visual { min-height: 210px; padding: 24px; }
      .login-visual::before { background-position: center 54%; }
      .login-visual::after { background: linear-gradient(90deg, rgba(8,83,89,.58), rgba(8,83,89,.12)); }
      .visual-copy h3 { font-size: 23px; }
      .visual-copy p { max-width: 290px; font-size: 12px; }
      .login-content { padding: 32px clamp(22px, 7vw, 48px) 28px; }
      .login-brand { margin-bottom: 20px; }
      .container-login .logo { width: min(220px, 80%); max-height: 76px; }
      .login-heading { margin-bottom: 25px; }
    }
    @media (max-width: 420px) {
      body.login-body { padding: 12px; align-items: flex-start; }
      .container-login { border-radius: 19px; margin: auto 0; }
      .login-visual { min-height: 165px; padding: 18px; }
      .visual-copy h3 { font-size: 20px; }
      .visual-copy p { font-size: 11px; line-height: 1.6; }
      .login-content { padding: 26px 20px 23px; }
      .container-login .login-input, .container-login .login-btn { height: 54px; min-height: 54px; border-radius: 13px; }
      .login-form { gap: 16px; }
      .login-footer { margin-top: 25px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .container-login *, .container-login *::before, .container-login *::after { transition: none !important; }
    }
  </style>
</head>
<body class="login-body">
  <main class="container-login">
    <section class="login-visual" aria-label="Informasi sekolah">
      <div class="visual-copy">
        <div class="visual-eyebrow">
          <span aria-hidden="true">✦</span> Sistem Internal Sekolah
        </div>
        <h3>Presensi Piket<br>Lebih Mudah.</h3>
        <p>Selamat datang di portal presensi piket SMK MedikaCom. Silakan masuk untuk melanjutkan.</p>
      </div>
    </section>

    <section class="login-content" aria-labelledby="loginTitle">
      <div class="login-brand">
        <img src="https://i.imgur.com/gGZSCOY.png" class="logo" alt="Logo SMK MedikaCom">
      </div>
      <header class="login-heading">
        <h2 id="loginTitle">Portal Presensi Piket</h2>
        <p>Silakan masuk untuk melanjutkan</p>
      </header>

      <form class="login-form" id="loginForm" onsubmit="event.preventDefault(); login();">
        <div class="login-field">
          <label for="idPiket">Username</label>
          <div class="login-input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-2a8 8 0 0 1 16 0v2"></path></svg>
            <input type="text" id="idPiket" class="login-input" placeholder="Masukkan username" autocomplete="username" required>
          </div>
        </div>
        <div class="login-field">
          <label for="kodeAkses">Password</label>
          <div class="login-input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><path d="M12 14v3"></path></svg>
            <input type="password" id="kodeAkses" class="login-input" placeholder="Masukkan password" autocomplete="current-password" required>
            <button class="password-toggle" type="button" id="togglePassword" aria-label="Tampilkan password" title="Tampilkan password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="login-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"></path></svg>
          Masuk
        </button>
      </form>
      <div class="error-msg" id="errorMsg" role="alert" aria-live="polite"></div>
      <footer class="login-footer">Sistem Presensi&nbsp; • &nbsp;SMK MedikaCom</footer>
    </section>
  </main>

  <div id="loadingOverlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="loadingText">Memproses...</p>
    </div>
  </div>

  <script>
    // Show/hide password; does not interfere with the existing auth.js.
    document.getElementById('togglePassword').addEventListener('click', function () {
      const password = document.getElementById('kodeAkses');
      const isHidden = password.type === 'password';
      password.type = isHidden ? 'text' : 'password';
      this.setAttribute('aria-label', isHidden ? 'Sembunyikan password' : 'Tampilkan password');
      this.setAttribute('title', isHidden ? 'Sembunyikan password' : 'Tampilkan password');
    });
  </script>
  <script src="./js/auth.js"></script>
</body>
</html>
