<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal Presensi Piket</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="dashboard-body">

<!-- TOAST CONTAINER -->
<div id="toastContainer"></div>

<!-- CONFIRM MODAL -->
<div id="confirmModal" class="modal-overlay">
  <div class="modal-box">
    <p id="confirmText">Yakin?</p>
    <div class="modal-actions" style="margin-top:15px; display:flex; gap:10px;">
      <button onclick="closeConfirm()" class="btn-cancel" style="background:#475569;">Batal</button>
      <button onclick="confirmYes()" class="btn-confirm" style="background:#0f766e;">Lanjut</button>
    </div>
  </div>
</div>

<!-- NOTIF MODAL -->
<div id="notifModal" class="modal-overlay">
  <div class="modal-box">
    <h3>✅ Rekap Presensi Hari Ini selesai dibuat</h3>
    <p><a id="pdfLink" href="#" target="_blank">Lihat Rekap PDF</a></p>
    <div style="margin-top:15px; display:flex; flex-direction:column; gap:8px;">
      <button type="button" id="btnKirimWA" onclick="kirimRekapGrupPiket()">Kirim Rekap ke Grup WA</button>
      <button type="button" style="background:#64748b;" onclick="closeNotif()">Tutup</button>
    </div>
  </div>
</div>

<!-- ERROR MODAL -->
<div id="errorModal" class="modal-overlay">
  <div class="modal-box">
    <h3 style="color:#ef4444;">❌ Rekap tidak dapat diproses</h3>
    <p id="errorMessage"></p>
    <button style="background:#ef4444;" onclick="closeError()">OK</button>
  </div>
</div>

<!-- LOADING OVERLAY -->
<div id="loadingOverlay">
  <div>
    <div class="spinner"></div>
    <p id="loadingText" style="margin-top:12px; font-weight:500; color:#1f2d2f;">Memproses...</p>
  </div>
</div>

<main>
  <!-- HEADER BOX -->
  <div class="header-box-kelas">
    <div style="display: flex; align-items: center; gap: 15px;">
      <!-- Banner Logo Utama MedikaCom -->
      <img src="https://i.imgur.com/gGZSCOY.png" class="logo-img" alt="Logo SMK MedikaCom">
      <div style="display: flex; flex-direction: column; align-items: flex-start;">
        <h2 style="margin: 0; font-size: 18px;">Portal Presensi Piket</h2>
        <span style="font-size: 13px; color: #006D77; font-weight: 500;" id="tanggalPresensi">-</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="text-align: right;">
        <div style="font-weight: 600; font-size: 13px;" id="petugasPiket">👤 -</div>
        <div style="font-size: 12px; color: #006D77;" id="roleUser">🟢 -</div>
      </div>
      <button onclick="logout()" title="Logout" aria-label="Logout" class="btn-logout">
        <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- TABEL & CARD Utama -->
  <form id="absenForm" onsubmit="handleSubmit(event)">
    <div class="card">
      
      <!-- FILTER WRAPPER -->
      <div class="filter-wrapper">
        <div class="filter-group">
          <div class="filter-item">
            <label for="filterKelas">Kelas:</label>
            <select id="filterKelas" onchange="applyFilter()"></select>
          </div>

          <div class="filter-item">
            <label for="filterTingkat">Tingkat:</label>
            <select id="filterTingkat" onchange="applyFilter()">
              <option value="">Semua</option>
              <option value="X">X</option>
              <option value="XI">XI</option>
              <option value="XII">XII</option>
            </select>
          </div>

          <div class="filter-item">
            <label for="filterStatus">Status Masuk:</label>
            <select id="filterStatus" onchange="applyFilter()">
              <option value="">Semua</option>
              <option value="Kosong">Kosong</option>
              <option value="Tepat Waktu">Tepat Waktu</option>
              <option value="Terlambat">Terlambat</option>
              <option value="Sakit">Sakit</option>
              <option value="Izin">Izin</option>
              <option value="Alpa">Alpa</option>
            </select>
          </div>

          <div class="filter-item">
            <label for="filterNama">Nama Siswa:</label>
            <input type="text" id="filterNama" placeholder="Cari nama..." oninput="applyFilter()" />
          </div>
        </div>

        <div class="jumlah-data-box">
          <label>Jumlah Data</label>
          <span id="jumlahData">0</span>
        </div>
      </div>

      <!-- HEADER ACTION DENGAN IKON LENGKAP -->
      <div class="table-header">
        <div class="left-action">
          <button type="button" onclick="tarikDataPresensi()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Tarik Data
          </button>
          
          <button type="button" onclick="cetakRekap()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            Rekap Presensi
          </button>

          <button type="button" onclick="refreshData()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            Refresh Data
          </button>

          <div id="adminFilter" style="display:none;">
            <input type="date" id="selectedDate" onchange="fetchData(this.value)">
          </div>
        </div>

        <div class="right-action">
          <button type="submit">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            Tersimpan
          </button>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Nama Siswa</th>
              <th>Kelas</th>
              <th>Tingkat</th>
              <th>Scan Masuk</th>
              <th>Status Masuk</th>
              <th>Scan Pulang</th>
            </tr>
          </thead>
          <tbody id="tbodySiswa">
            <tr><td colspan="6">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </form>

  <!-- PAGINATION -->
  <div class="table-footer">
    <div id="pagination"></div>
  </div>
</main>

<footer>
  © 2026 Presensi Digital SMK MedikaCom v4.0
</footer>

<script src="./js/dashboard.js"></script>
</body>
</html>
